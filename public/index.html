<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SockTank</title>
  <style>
    @font-face {
      font-family: 'Unbounded';
      src: url('/fonts/Unbounded-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 900;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #F3EFD4;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(24px, 5vw, 60px);
      font-family: 'Unbounded', sans-serif;
      overflow: hidden;
    }
    h1 {
      font-size: clamp(40px, 7vw, 100px);
      color: #1a1a1a;
      letter-spacing: 4px;
      text-align: center;
    }
    .buttons {
      display: flex; flex-direction: column;
      align-items: center; gap: clamp(16px, 3vw, 36px);
    }
    .btn {
      background: none; border: none; cursor: pointer; padding: 0;
      transition: transform 0.1s, filter 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn:hover  { transform: scale(1.05); filter: brightness(0.9); }
    .btn:active { transform: scale(0.97); }
    .btn img { display: block; width: clamp(200px, 28vw, 420px); height: auto; }

    /* ── Modal overlay ── */
    #modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      align-items: center; justify-content: center;
      z-index: 100;
    }
    #modal-overlay.open { display: flex; }
    #modal {
      background: #F3EFD4;
      border: 3px solid #1a1a1a;
      border-radius: 16px;
      padding: clamp(28px, 5vw, 56px) clamp(32px, 6vw, 72px);
      display: flex; flex-direction: column;
      align-items: center; gap: 28px;
      min-width: clamp(280px, 40vw, 520px);
    }
    #modal h2 {
      font-size: clamp(20px, 3vw, 36px);
      color: #1a1a1a; letter-spacing: 2px; text-align: center;
    }
    #code-input {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 700;
      letter-spacing: 10px;
      width: 100%;
      text-align: center;
      background: none;
      border: none;
      border-bottom: 3px solid #1a1a1a;
      color: #1a1a1a;
      outline: none;
      padding: 8px 0;
    }
    #code-input::placeholder { color: #bbb; letter-spacing: 8px; }
    #modal-error {
      font-size: 14px; color: #c0392b;
      min-height: 18px; text-align: center;
    }
    .modal-btns { display: flex; gap: 20px; }
    .modal-btn {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(13px, 1.5vw, 18px);
      font-weight: 700;
      letter-spacing: 1px;
      padding: 14px 32px;
      border-radius: 8px;
      border: 2px solid #1a1a1a;
      cursor: pointer;
      transition: transform 0.1s, filter 0.1s;
    }
    .modal-btn:hover  { transform: scale(1.04); filter: brightness(0.92); }
    .modal-btn:active { transform: scale(0.97); }
    .modal-btn.primary { background: #1a1a1a; color: #F3EFD4; }
    .modal-btn.secondary { background: none; color: #1a1a1a; }
  </style>
</head>
<body>
  <h1>SockTank</h1>
  <div class="buttons">
    <button class="btn" onclick="location.href='/create'">
      <img src="/svg/creategame.svg" alt="Create Game">
    </button>
    <button class="btn" onclick="location.href='/join'">
      <img src="/svg/joingame.svg" alt="Join Game">
    </button>
    <button class="btn" onclick="openModal()">
      <img src="/svg/watchgame.svg" alt="Watch Game" onerror="this.replaceWith(makeFallbackBtn('Open Game'))">
    </button>
  </div>

  <!-- Modal -->
  <div id="modal-overlay">
    <div id="modal">
      <h2>Enter Game Code</h2>
      <input
        id="code-input"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="000000"
        autocomplete="off"
        spellcheck="false"
        oninput="onCodeInput(this)"
        onkeydown="onCodeKeydown(event)"
      >
      <div id="modal-error"></div>
      <div class="modal-btns">
        <button class="modal-btn secondary" onclick="closeModal()">Cancel</button>
        <button class="modal-btn primary" onclick="submitCode()">Open Game</button>
      </div>
    </div>
  </div>

<script>
  // Fallback if watchgame.svg doesn't exist yet
  function makeFallbackBtn(label) {
    const span = document.createElement('span');
    span.style.cssText = `
      display:inline-block; padding:18px 48px;
      border:3px solid #1a1a1a; border-radius:10px;
      font-family:Unbounded,sans-serif; font-size:clamp(14px,2vw,22px);
      font-weight:700; color:#1a1a1a; letter-spacing:2px;
      width:clamp(200px,28vw,420px); text-align:center;
    `;
    span.textContent = label;
    return span;
  }

  function openModal() {
    document.getElementById('modal-overlay').classList.add('open');
    document.getElementById('code-input').value = '';
    document.getElementById('modal-error').textContent = '';
    setTimeout(() => document.getElementById('code-input').focus(), 50);
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  // Only allow digits
  function onCodeInput(el) {
    el.value = el.value.replace(/\D/g, '').slice(0, 6);
    document.getElementById('modal-error').textContent = '';
  }

  function onCodeKeydown(e) {
    if (e.key === 'Enter') submitCode();
    if (e.key === 'Escape') closeModal();
  }

  // Click outside modal to close
  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  async function submitCode() {
    const code = document.getElementById('code-input').value.trim();
    if (code.length !== 6) {
      document.getElementById('modal-error').textContent = 'Please enter a 6-digit code.';
      return;
    }

    // Verify the room exists before navigating
    try {
      const res = await fetch('/room-exists?code=' + code);
      const data = await res.json();
      if (!data.exists) {
        document.getElementById('modal-error').textContent = 'Room not found. Check the code and try again.';
        return;
      }
    } catch {
      // If check fails (e.g. network), just navigate anyway
    }

    location.href = '/game?code=' + code;
  }
</script>
</body>
</html>
